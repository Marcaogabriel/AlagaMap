<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>AlagaMap — Rotas seguras em dias de chuva</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <section id="authScreen" class="screen active">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Alaga<span>Map</span></h1>
        <p>Cadastro, login e alertas inteligentes de alagamento.</p>
      </div>

      <div class="tab-buttons">
        <button type="button" class="tab-button active" data-tab="login">Login</button>
        <button type="button" class="tab-button" data-tab="register">Cadastro</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <div class="field">
          <label for="loginEmail">E-mail</label>
          <input id="loginEmail" type="email" placeholder="seu@email.com" required />
        </div>

        <div class="field">
          <label for="loginPassword">Senha</label>
          <input id="loginPassword" type="password" placeholder="Sua senha" required />
        </div>

        <button type="submit" class="primary-btn">Entrar no mapa</button>
      </form>

      <form id="registerForm" class="auth-form">
        <div class="field">
          <label for="registerName">Nome completo</label>
          <input id="registerName" type="text" placeholder="Seu nome" required />
        </div>

        <div class="field">
          <label for="registerEmail">E-mail</label>
          <input id="registerEmail" type="email" placeholder="seu@email.com" required />
        </div>

        <div class="field">
          <label for="registerPassword">Senha</label>
          <input id="registerPassword" type="password" placeholder="Mínimo 6 caracteres" required />
        </div>

        <div class="field">
          <label for="registerConfirmPassword">Confirmar senha</label>
          <input id="registerConfirmPassword" type="password" placeholder="Repita a senha" required />
        </div>

        <button type="submit" class="primary-btn">Cadastrar</button>
      </form>
    </div>
  </section>

  <script src="./js/app.js"></script>
</body>
</html>
